<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Illustration of a young male mentor teaching online">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f7f0" />
      <stop offset="100%" stop-color="#cdeadd" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f9f6e" />
      <stop offset="100%" stop-color="#087a54" />
    </linearGradient>
  </defs>

  <circle cx="300" cy="300" r="270" fill="url(#bg)" />
  <circle cx="300" cy="300" r="210" fill="#ffffff" opacity=".45" />

  <!-- floating lesson cards -->
  <g opacity=".95">
    <rect x="52" y="150" width="150" height="78" rx="16" fill="#ffffff" />
    <rect x="70" y="170" width="46" height="46" rx="12" fill="#d8f3e7" />
    <path d="M83 193h20M93 183v20" stroke="#0f9f6e" stroke-width="4" stroke-linecap="round" />
    <rect x="128" y="174" width="56" height="7" rx="3.5" fill="#cbd5e1" />
    <rect x="128" y="190" width="40" height="7" rx="3.5" fill="#e2e8f0" />
  </g>
  <g opacity=".95">
    <rect x="396" y="118" width="152" height="74" rx="16" fill="#ffffff" />
    <circle cx="426" cy="155" r="16" fill="#fef3c7" />
    <path d="M426 147v9l6 4" stroke="#d97706" stroke-width="3.5" stroke-linecap="round" />
    <rect x="452" y="143" width="74" height="7" rx="3.5" fill="#cbd5e1" />
    <rect x="452" y="159" width="52" height="7" rx="3.5" fill="#e2e8f0" />
  </g>

  <!-- desk -->
  <rect x="120" y="430" width="360" height="20" rx="10" fill="#0c2b2a" opacity=".9" />
  <rect x="168" y="450" width="18" height="72" rx="8" fill="#0c2b2a" opacity=".7" />
  <rect x="414" y="450" width="18" height="72" rx="8" fill="#0c2b2a" opacity=".7" />

  <!-- laptop -->
  <path d="M232 360h136l20 70H212l20-70Z" fill="#0c2b2a" />
  <rect x="244" y="372" width="112" height="48" rx="6" fill="#8ee3bd" />
  <path d="M264 388h48M264 400h72" stroke="#0f9f6e" stroke-width="5" stroke-linecap="round" />
  <rect x="200" y="430" width="200" height="8" rx="4" fill="#1c423e" />

  <!-- male tutor: body -->
  <path d="M252 430c0-58 22-92 48-92s48 34 48 92" fill="url(#shirt)" />
  <rect x="288" y="330" width="24" height="26" rx="10" fill="#d9a97e" />

  <!-- head -->
  <circle cx="300" cy="300" r="42" fill="#e8b98f" />
  <!-- ears -->
  <circle cx="258" cy="302" r="7" fill="#e8b98f" />
  <circle cx="342" cy="302" r="7" fill="#e8b98f" />
  <!-- short hair -->
  <path d="M258 294c0-32 18-52 42-52s42 20 42 52c-10-10-18-16-26-18-12 8-30 10-44 4-5 4-10 8-14 14Z" fill="#1f2933" />
  <!-- beard / stubble -->
  <path d="M268 312c4 22 16 34 32 34s28-12 32-34c-8 10-19 15-32 15s-24-5-32-15Z" fill="#2f3a33" opacity=".85" />
  <!-- eyes + smile -->
  <circle cx="286" cy="298" r="3" fill="#1f2933" />
  <circle cx="314" cy="298" r="3" fill="#1f2933" />
  <path d="M290 316c6 5 14 5 20 0" stroke="#a8623c" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- graduation cap -->
  <path d="M300 226 372 258 300 290 228 258l72-32Z" fill="#0c2b2a" />
  <path d="M266 274v22c0 12 16 22 34 22s34-10 34-22v-22l-34 14-34-14Z" fill="#14544a" />
  <path d="M372 258v34" stroke="#e2b53b" stroke-width="4" stroke-linecap="round" />
  <circle cx="372" cy="296" r="6" fill="#e2b53b" />

  <!-- book -->
  <rect x="430" y="392" width="70" height="38" rx="6" fill="#ffffff" />
  <path d="M465 392v38" stroke="#0f9f6e" stroke-width="3" />
  <path d="M438 404h20M438 414h20M472 404h20M472 414h20" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
</svg>
